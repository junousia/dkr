[package]
name = "dkr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Run one-off commands from docker images using named per-image profiles"
repository = "https://github.com/junousia/dkr"
homepage = "https://github.com/junousia/dkr"
readme = "README.md"
keywords = ["docker", "cli", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "5.0"
is-terminal = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
shellexpand = "3.1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23.0"
