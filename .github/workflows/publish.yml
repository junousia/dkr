name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate publishing without uploading or releasing.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-dkr
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build release binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs_on: ubuntu-latest
            cargo_target: ""
            binary_path: target/release/dkr
          - platform: linux-arm64
            runs_on: ubuntu-24.04-arm
            cargo_target: ""
            binary_path: target/release/dkr
          - platform: macos-x86_64
            runs_on: macos-15-intel
            cargo_target: ""
            binary_path: target/release/dkr
          - platform: macos-arm64
            runs_on: macos-15
            cargo_target: aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/dkr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: |
          if [ -n "${{ matrix.cargo_target }}" ]; then
            rustup target add "${{ matrix.cargo_target }}"
            cargo build --release --target "${{ matrix.cargo_target }}"
          else
            cargo build --release
          fi
          mkdir -p "dist/${{ matrix.platform }}"
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.platform }}/dkr"
          chmod 755 "dist/${{ matrix.platform }}/dkr"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dkr-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/dkr
          if-no-files-found: error
          retention-days: 7

  crates-io:
    name: Publish crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${tag}" != "${version}" ]; then
            echo "Tag v${tag} does not match Cargo.toml version ${version}." >&2
            exit 1
          fi

      - name: Verify
        run: make check

      - name: Validate package
        run: make publish-dry-run

      - name: Publish to crates.io
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for publishing." >&2
            exit 2
          fi
          set +e
          make publish > /tmp/cargo-publish.out 2> /tmp/cargo-publish.err
          code="$?"
          set -e
          cat /tmp/cargo-publish.out
          cat /tmp/cargo-publish.err >&2
          if [ "${code}" -eq 0 ]; then
            exit 0
          fi
          if grep -Eiq 'already exists|previously uploaded' /tmp/cargo-publish.out /tmp/cargo-publish.err; then
            echo "Crate version already exists on crates.io; treating publish as complete for rerun idempotency."
            exit 0
          fi
          exit "${code}"

  github-release:
    name: Create GitHub Release with binaries
    runs-on: ubuntu-latest
    needs:
      - build-binaries
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dkr-*
          path: dist

      - name: Flatten binaries per platform
        run: |
          mkdir -p flat
          for dir in dist/dkr-*; do
            platform="$(basename "${dir}" | sed 's/^dkr-//')"
            mv "${dir}/dkr" "flat/dkr-${platform}"
            chmod 755 "flat/dkr-${platform}"
          done
          rm -rf dist
          mv flat dist
          ls -la dist

      - name: Create release and upload binaries
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/dkr-*
          generate_release_notes: true
